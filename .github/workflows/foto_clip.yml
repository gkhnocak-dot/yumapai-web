name: foto-clip
# Geo-foto görüntü kapısı ölçümü (Reis onayı 21.11.2026). DB'ye YAZMAZ. Modeller: openai/clip-vit-base-patch32 (MIT), google/siglip-base-patch16-224 (Apache-2.0).
on:
  push:
    branches: [veri-foto-clip]
    paths: ['score.py','prompts.json','manifest.json','img/**','.github/workflows/foto_clip.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install transformers pillow sentencepiece protobuf
      - run: python score.py
      - name: Sonuc dalina yaz
        if: always()
        run: |
          mkdir -p /tmp/c && cp skor.json /tmp/c/ 2>/dev/null || true
          cd /tmp/c && git init -q -b veri-foto-clip-cikti
          git config user.name "YuMapAI veri" && git config user.email "noreply@yumapai.com"
          git add -A && git commit -q --allow-empty -m "CLIP olcum cikti"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin veri-foto-clip-cikti
