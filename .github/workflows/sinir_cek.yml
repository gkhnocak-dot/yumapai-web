name: sinir-cek
on:
  push:
    branches: [veri-overture]
    paths: ['arac/sinir_cek.py', '.github/workflows/sinir_cek.yml']
permissions:
  contents: write
jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: veri-overture }
      - run: pip install duckdb==1.4.1
      - run: python arac/sinir_cek.py
      - run: |
          git config user.name "YuMapAI veri" && git config user.email "noreply@yumapai.com"
          git add sinir
          git commit -m "Overture il/ilçe sınırları (Türkiye, ODbL, yalnız kanıt) — tek seferlik çekim" && git push
