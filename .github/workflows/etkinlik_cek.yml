name: etkinlik-cek
on:
  push:
    branches: [veri-overture]
    paths: ['arac/etkinlik_cek.py', '.github/workflows/etkinlik_cek.yml']
permissions:
  contents: write
jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: veri-overture }
      - run: pip install duckdb==1.1.3
      - run: python arac/etkinlik_cek.py
      - run: |
          git config user.name "YuMapAI veri" && git config user.email "noreply@yumapai.com"
          git add etkinlik_tr.csv etkinlik_kodlar.csv etkinlik_surum.txt
          git commit -m "Overture etkinlik türleri (Türkiye) — tek seferlik çekim" && git push
