name: muzik-cek
# Tek seferlik hikâye müziği çekimi (Reis onayı 20.11.2026). Yalnız muzik/muzik_katalog.json'daki resmi indirme bağlantıları;
# lisansı doğrulanamayan parça atlanır. Sonuç depoya YAZILMAZ: artefakt (mp3 + kayıt + seed SQL + rapor) ve, secret varsa, Supabase Storage 'music' kovası.
on:
  push:
    branches: [veri-muzik]
    paths: ['arac/muzik_cek.py', 'arac/muzik_aday.py', 'muzik/muzik_katalog.json', '.github/workflows/muzik_cek.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: ffmpeg -version | head -1
      - name: Aday listesi (FMA/Musopen; Openverse resmi API, indirme yok)
        continue-on-error: true
        run: python3 arac/muzik_aday.py muzik_aday.json
      - name: Katalogdan çek + lisans doğrula + 128 kbps + (secret varsa) Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 arac/muzik_cek.py --katalog muzik/muzik_katalog.json --cikti muzik_cikti
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: muzik-cikti
          path: |
            muzik_cikti/
            muzik_aday.json
            !muzik_cikti/_ham
          retention-days: 14
