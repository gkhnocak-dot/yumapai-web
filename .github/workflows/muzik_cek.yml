name: muzik-cek
# Tek seferlik hikâye müziği çekimi (Reis onayı 20.11.2026). Yalnız muzik/muzik_katalog.json'daki resmi indirme bağlantıları;
# lisansı doğrulanamayan parça atlanır. Sonuç ana dala YAZILMAZ: 'veri-muzik-cikti' dalına (mp3 + muzik_kayit.json + muzik_seed.sql + rapor.md +
# muzik_aday.json) tek commit olarak zorla yazılır; ayrıca, secret varsa, Supabase Storage 'music' kovasına yüklenir.
on:
  push:
    branches: [veri-muzik]
    paths: ['arac/muzik_cek.py', 'arac/muzik_aday.py', 'muzik/muzik_katalog.json', '.github/workflows/muzik_cek.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg kur
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Aday listesi (FMA/Musopen; Openverse resmi API, indirme yok)
        continue-on-error: true
        run: python3 arac/muzik_aday.py muzik_aday.json
      - name: Katalogdan çek + lisans doğrula + 128 kbps + (secret varsa) Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 arac/muzik_cek.py --katalog muzik/muzik_katalog.json --cikti muzik_cikti
      - name: Çıktıyı veri-muzik-cikti dalına yaz
        if: always()
        run: |
          rm -rf muzik_cikti/_ham
          mkdir -p /tmp/cikti
          cp -r muzik_cikti/. /tmp/cikti/ 2>/dev/null || true
          cp muzik_aday.json muzik_aday_durum.json /tmp/cikti/ 2>/dev/null || true
          cd /tmp/cikti
          git init -q -b veri-muzik-cikti
          git config user.name "YuMapAI veri" && git config user.email "noreply@yumapai.com"
          git add -A
          git commit -q -m "Hikâye müziği çekim çıktısı (tek seferlik; lisans doğrulanan parçalar + kayıt + seed SQL + rapor)"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin veri-muzik-cikti
