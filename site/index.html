<!DOCTYPE html>
<html lang="tr">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>YuMapAI</title>
  <meta name="description" content="YuMapAI: Türkiye'yi keşfet, gezini planla. Yumy gezi rehberi, Keşfet, arkadaşlarının gezileri ve mesajlar.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#05080E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="YuMapAI">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">
  <meta property="og:site_name" content="YuMapAI">
  <meta property="og:locale" content="tr_TR">
  <meta property="og:title" content="YuMapAI">
  <meta property="og:description" content="Türkiye'yi keşfet, gezini planla. Yumy gezi rehberi seninle.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icons/Icon-512.png">
  <link rel="stylesheet" href="yu-web.css">
  <!-- the engine script is the same on every browser: start its download now instead of after flutter_bootstrap.js ran -->
  <link rel="preload" href="main.dart.js" as="script">
  <!-- açılış plakası logosu: HTML plaka ve Flutter plakası aynı dosyayı kullanır (tek indirme) -->
  <link rel="preload" href="assets/assets/images/yumapai-logo-tam.png" as="image">
  <!-- MapLibre GL JS 4.7.1 (BSD-3), self-hosted: harita (maplibre_gl web) CDN'den değil buradan yüklenir -->
  <link rel="stylesheet" href="maplibre/maplibre-gl.css">
  <style id="yu-file-input">
    /* Fotoğraf seçicinin gizli <input type=file> öğesi: iOS menüsü bu öğeye bağlanır; görünmez, 1 px, ekranın üst köşesinde */
    flt-image-picker-inputs, flt-image-picker-inputs input, flt-file-picker-inputs, flt-file-picker-inputs input,
    body > input[type=file] {
      position: fixed !important; top: 0 !important; left: 0 !important;
      width: 1px !important; height: 1px !important; opacity: 0 !important;
      overflow: hidden !important; pointer-events: none !important; border: 0 !important; margin: 0 !important; padding: 0 !important;
    }
  </style>
</head>
<body>
  <div id="yu-splash" aria-hidden="true"><img src="assets/assets/images/yumapai-logo-tam.png" alt="" width="168" height="168"></div>
  <button type="button" id="yu-sw-update" data-yu-update hidden>Yeni sürüm hazır · Yenile</button>
  <noscript><p class="yu-noscript">YuMapAI'yi kullanmak için tarayıcında JavaScript açık olmalı.</p></noscript>
  <!-- Açılış ekranı büyük betikler gelmeden çizilebilsin. Harita ve yönlendirme kancalarının sırasını koru. -->
  <script src="maplibre/maplibre-gl.js"></script>
  <script src="yu-web.js"></script>
  <script src="yu-sw-init.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
